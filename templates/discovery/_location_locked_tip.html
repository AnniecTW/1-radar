{% comment %}Shown on hover or focus of a location control that "Don't use my location" turned off. Needs: tip_id.{% endcomment %}
<span class="locked-tip" id="{{ tip_id }}" role="tooltip">You chose not to share your location, so this is turned off. To use it, go to Profile → Preferences → <a href="{% url 'account_preferences' %}">Account &amp; privacy</a> and choose “While I’m using Radar”.</span>
