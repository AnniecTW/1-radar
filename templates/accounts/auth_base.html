{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RADAR{% endblock %} · RADAR</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'radar/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'radar/auth.css' %}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-form-side">
        <a class="auth-brand" href="/" aria-label="RADAR home">
          <svg class="brand-mark" viewBox="0 0 56 64" aria-hidden="true">
            <path d="M45.9 16.1A25.5 25.5 0 1 0 52.9 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M40 22A17 17 0 1 0 44.9 35" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="m16 33 24-9-11 23-2-11z" transform="translate(28 35) scale(.94) translate(-28 -35)" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="1.4"/>
            <circle cx="49" cy="26" r="3.6" fill="#f45143"/>
          </svg>
          <span>RADAR</span>
        </a>
        {% block form %}{% endblock %}
      </div>
      <aside class="auth-art" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1000&q=85" alt="">
        <div class="auth-art-overlay">
          <div class="eyebrow">HYPER-LOCAL AI EVENT RADAR</div>
          <strong>Events.<br>People.<br>A stronger campus.</strong>
          <em></em>
        </div>
      </aside>
    </section>
  </main>
  <script src="{% static 'radar/auth.js' %}"></script>
</body>
</html>
