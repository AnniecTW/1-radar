{% extends 'accounts/app_base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="banner slim">
  <div class="banner-copy">
    <a class="back-link" href="{% url 'account_preferences' %}">‹ Back to Preferences</a>
    <h1>Change password</h1>
  </div>
  <div class="banner-actions">
    <a class="banner-button" href="{% url 'account_preferences' %}">Cancel</a>
    <button class="banner-button solid" type="submit" form="password-form">Change password</button>
  </div>
</section>

<main class="narrow">
  <form class="stack" id="password-form" method="post" novalidate>
    {% csrf_token %}
    <label class="field">
      <span>Current password</span>
      <input type="password" name="old_password" autocomplete="current-password" required>
      {% for error in form.old_password.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
    </label>
    <label class="field">
      <span>New password</span>
      <input type="password" name="new_password1" autocomplete="new-password" required>
      {% for error in form.new_password1.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
    </label>
    <label class="field">
      <span>Confirm new password</span>
      <input type="password" name="new_password2" autocomplete="new-password" required>
      {% for error in form.new_password2.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
    </label>
  </form>
</main>
{% endblock %}
