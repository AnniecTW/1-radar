{% extends 'accounts/auth_base.html' %}
{% block title %}Forgot password{% endblock %}
{% block form %}
<div class="auth-heading">
  <div class="eyebrow">RESET PASSWORD</div>
  <h1>Forgot your <i>password?</i></h1>
  <p>Enter your account email and we'll send you a link to choose a new one.</p>
</div>

<form class="auth-form" method="post" novalidate>
  {% csrf_token %}
  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ form.email.value|default:'' }}" placeholder="you@university.edu" autocomplete="email" required>
    {% for error in form.email.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
  </label>
  <button class="auth-submit" type="submit">Send reset link <span aria-hidden="true">→</span></button>
</form>

<p class="auth-switch">Remembered it? <a href="{% url 'login' %}">Sign in</a></p>
{% endblock %}
