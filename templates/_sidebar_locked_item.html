{% comment %}A sidebar item guests can see but not open. Needs: icon, label, tip.{% endcomment %}
<span class="nav-locked" role="link" aria-disabled="true" tabindex="0" aria-describedby="locked-tip-{{ icon }}">
  <i data-lucide="{{ icon }}" aria-hidden="true"></i>{{ label }}<i class="nav-lock" data-lucide="lock" aria-hidden="true"></i>
  <span class="nav-tooltip" role="tooltip" id="locked-tip-{{ icon }}">{{ tip }}</span>
</span>
